<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <!--
      Las metaetiquetas por página (title, description, canonical, Open Graph,
      Twitter y structured data) las inyecta react-helmet-async desde el
      componente SEO. Aquí solo va el respaldo mínimo: duplicarlas provocaba dos
      <meta name="description"> por página, y los rastreadores leen la primera.
    -->
    <title>Andrés Contreras | Desarrollador Full-Stack con IA</title>

    <!--
      Aquí había tres `preconnect` a Google Fonts que no servían para nada: no
      se pedía ninguna hoja de estilos a ese dominio, así que abrían una
      conexión TLS con Google en cada visita y no descargaban nada. La fuente
      ahora se sirve desde este mismo dominio (ver src/main.tsx), lo que además
      evita anunciarle a Google cada visita que recibes.
    -->

    <!--
      Hojas de estilo de la plantilla ISAK, tal cual vienen en el paquete.
      Viven en /public para que Vite no las procese ni reescriba las rutas
      relativas que usan internamente hacia ../fonts y ../images.
    -->
    <link rel="stylesheet" href="/assets/fonts/fonts.css" />
    <link rel="stylesheet" href="/assets/fonts/inter/inter.css" />
    <link rel="stylesheet" href="/assets/icon/icomoon/style.css" />
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/assets/css/swiper-bundle.min.css" />
    <link rel="stylesheet" href="/assets/css/animate.css" />
    <link rel="stylesheet" href="/assets/css/styles.css" />
  </head>

  <!--
    Los atributos del <body> son los del index.html de la plantilla y no son
    decorativos: `data-default-mode="dark"` es lo que selecciona el tema
    oscuro, y `counter-scroll` lo lee su JavaScript para los contadores.
  -->
  <body data-default-mode="dark" class="counter-scroll">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

  </body>
</html>
