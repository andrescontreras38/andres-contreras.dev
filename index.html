<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <!--
      Las metaetiquetas por página (title, description, canonical, Open Graph,
      Twitter y structured data) las inyecta react-helmet-async desde el
      componente SEO. Aquí solo va el respaldo mínimo: duplicarlas provocaba dos
      <meta name="description"> por página, y los rastreadores leen la primera.
    -->
    <title>Andrés Contreras | Desarrollador Full-Stack con IA</title>

    <!--
      Aquí había tres `preconnect` a Google Fonts que no servían para nada: no
      se pedía ninguna hoja de estilos a ese dominio, así que abrían una
      conexión TLS con Google en cada visita y no descargaban nada. La fuente
      ahora se sirve desde este mismo dominio (ver src/main.tsx), lo que además
      evita anunciarle a Google cada visita que recibes.
    -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
