<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#070a12"/><stop offset="1" stop-color="#0b1328"/>
</linearGradient>
<radialGradient id="glow" cx="800" cy="450" r="430" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#2563EB" stop-opacity="0.28"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
</radialGradient>
<linearGradient id="new" x1="1000" y1="300" x2="1240" y2="600" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#1D4ED8"/>
</linearGradient>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#glow)"/>

<!-- plataforma antigua: bloques desalineados y apagados -->
<g opacity="0.5">
<rect x="372" y="322" width="92" height="92" rx="12" fill="#243049" transform="rotate(-6 418 368)"/>
<rect x="486" y="338" width="92" height="92" rx="12" fill="#1e2940" transform="rotate(4 532 384)"/>
<rect x="360" y="440" width="92" height="92" rx="12" fill="#1e2940" transform="rotate(3 406 486)"/>
<rect x="480" y="452" width="92" height="92" rx="12" fill="#243049" transform="rotate(-5 526 498)"/>
<rect x="418" y="556" width="92" height="92" rx="12" fill="#1a2338" transform="rotate(7 464 602)"/>
</g>

<!-- flujo de migración -->
<path d="M648 470 H900" stroke="#2563EB" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="10 12"/>
<path d="M660 430 H930" stroke="#60A5FA" stroke-width="3" stroke-linecap="round"/>
<path d="M906 406 L936 430 L906 454" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="700" cy="430" r="5" fill="#93C5FD"/>
<circle cx="790" cy="430" r="5" fill="#60A5FA" fill-opacity="0.7"/>
<circle cx="868" cy="430" r="5" fill="#60A5FA" fill-opacity="0.4"/>

<!-- stack nuevo: bloques alineados -->
<g>
<rect x="1010" y="316" width="100" height="100" rx="14" fill="url(#new)" fill-opacity="0.9"/>
<rect x="1130" y="316" width="100" height="100" rx="14" fill="#1e3a8a" fill-opacity="0.55" stroke="#60A5FA" stroke-opacity="0.35"/>
<rect x="1010" y="436" width="100" height="100" rx="14" fill="#1e3a8a" fill-opacity="0.55" stroke="#60A5FA" stroke-opacity="0.35"/>
<rect x="1130" y="436" width="100" height="100" rx="14" fill="url(#new)" fill-opacity="0.9"/>
<rect x="1010" y="556" width="220" height="60" rx="14" fill="#0f1c3a" stroke="#60A5FA" stroke-opacity="0.25"/>
</g>

<!-- línea base -->
<path d="M300 700 H1300" stroke="#60A5FA" stroke-opacity="0.12" stroke-width="2"/>
</svg>
